<!DOCTYPE html>
<!-- 住戶端 Pad：只負責「顯示」，不控制任何東西。
     狀態由主展示網站（index.html）透過 WebSocket 推過來，見 js/sync.js。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020912">
<title>住戶端 — 逃生指引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<!-- style.css 只是為了共用 :root 的色票，版面全部由 pad.css 蓋掉 -->
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/pad.css">
</head>
<body class="pad" data-state="safe">

<header class="pad__bar">
  <span class="pad__brand">住戶端 · RESIDENT</span>
  <span class="pad__link" id="link" data-ok="0"><i></i><b>連線中…</b></span>
</header>

<main class="pad__main">

  <!-- 狀態燈號（四個狀態共用，靠 body[data-state] 換色與動畫） -->
  <div class="pad__beacon" aria-hidden="true"><i></i><i></i><i></i></div>

  <p class="pad__kicker" id="kicker">系統待機中</p>
  <h1 class="pad__title" id="title">安全</h1>
  <p class="pad__sub" id="sub">住戶端連線正常，目前無異常</p>

  <!-- 逃生指引：只有 aiRoute 會顯示 -->
  <div class="pad__route" id="route" hidden>
    <ol class="pad__steps">
      <li><span>1</span>目前位置</li>
      <li><span>2</span>沿走廊前進</li>
      <li class="is-goal"><span>3</span><b id="goal">B 出口</b></li>
    </ol>
  </div>

</main>

<footer class="pad__foot">
  <span id="foot">火災無情 · 預防先行</span>
</footer>

<script type="module" src="./js/pad.js"></script>
</body>
</html>
